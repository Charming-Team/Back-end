spring:
  application:
    name: server
  profiles:
    default: local
  jpa:
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: true
    path: /api/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/swagger-ui.html
    config-url: /api/v3/api-docs/swagger-config
    url: /api/v3/api-docs

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  internal:
    chat:
      evidence-token: ${CHAT_EVIDENCE_INTERNAL_TOKEN:}
  report:
    mail:
      from: ${REPORT_MAIL_FROM:no-reply@smap.local}
  jwt:
    access-token-expiration-ms: 300000
    refresh-token-expiration-ms: 86400000

ai:
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://fastapi-service:8000}
    planning-generate-path: ${AI_FASTAPI_PLANNING_GENERATE_PATH:/ai/api/v1/planning}
    chat-answer-path: /ai/api/v1/chat/answer
    chat-answer-internal-token: ${CHAT_ANSWER_INTERNAL_TOKEN:}
    timeout-seconds: 60
    risk:
      delay-probability-predict-path: ${AI_FASTAPI_DELAY_PROBABILITY_PREDICT_PATH:/api/v1/delay-probability/predict}
      connect-timeout-ms: ${AI_FASTAPI_RISK_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${AI_FASTAPI_RISK_READ_TIMEOUT_MS:10000}
      internal-token: ${AI_FASTAPI_RISK_INTERNAL_TOKEN:}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smap}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:smap}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
app:
  jwt:
    secret: ${JWT_SECRET}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: >-
      jdbc:h2:mem:s_map-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS role_enum AS VARCHAR(30)\;CREATE DOMAIN IF NOT EXISTS user_status_enum AS VARCHAR(30)\;CREATE DOMAIN IF NOT EXISTS order_status_enum AS VARCHAR(30)\;CREATE DOMAIN IF NOT EXISTS plan_status_enum AS VARCHAR(30)\;CREATE DOMAIN IF NOT EXISTS inventory_status_enum AS VARCHAR(30)\;CREATE DOMAIN IF NOT EXISTS material_plan_status_enum AS VARCHAR(30)
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  jwt:
    secret: test-jwt-secret-key-for-h2-tests-only

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  internal:
    chat:
      evidence-token: ${CHAT_EVIDENCE_INTERNAL_TOKEN}
  jwt:
    secret: ${JWT_SECRET}

ai:
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://fastapi-service:8000}
    chat-answer-internal-token: ${CHAT_ANSWER_INTERNAL_TOKEN}
